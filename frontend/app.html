<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPal — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F5F6FA;
      --card-bg:     #FFFFFF;
      --border:      #ECEEF3;
      --border2:     #F2F3F7;
      --text:        #14181F;
      --muted:       #8A93A6;
      --muted2:      #B4BAC7;

      --accent:       #2F6FED;
      --accent-dark:  #1B4FC4;
      --accent-light: #EAF1FF;

      --green:        #22C55E;
      --green-light:  #E9FBF0;
      --red:          #EF4444;
      --red-light:    #FEEBEC;
      --amber:        #F59E0B;
      --amber-light:  #FFF6E5;

      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --ff: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    [data-theme="dark"] {
      --bg:          #0E1015;
      --card-bg:     #181B22;
      --border:      #262A33;
      --border2:     #20232B;
      --text:        #EFF1F5;
      --muted:       #8A93A6;
      --muted2:      #5A6070;

      --accent:       #F97316;
      --accent-dark:  #C2570A;
      --accent-light: rgba(249,115,22,0.14);

      --green-light:  rgba(34,197,94,0.14);
      --red-light:    rgba(239,68,68,0.14);
      --amber-light:  rgba(245,158,11,0.14);

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff), -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }

    button { font-family: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-back {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: color 0.15s, border-color 0.15s, background .15s;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .header-back:hover { color: var(--text); background: var(--bg); }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 4px;
      text-decoration: none;
    }
    .header-logo-mark {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 18px;
    }
    .header-logo-mark span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
    }
    .header-logo-mark span:nth-child(1) { height: 8px; }
    .header-logo-mark span:nth-child(2) { height: 14px; }
    .header-logo-mark span:nth-child(3) { height: 18px; }
    .header-logo-mark span:nth-child(4) { height: 11px; }
    .header-logo-mark span:nth-child(5) { height: 6px; }
    .header-brand { font-size: 1rem; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card-bg);
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
      flex-shrink: 0;
    }
    .theme-btn:hover { background: var(--bg); }

    .dashboard-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border: 1px solid var(--accent-light);
      border-radius: var(--radius-sm);
      transition: background 0.15s, border-color 0.15s;
    }
    .dashboard-btn:hover { background: var(--accent-light); }

    .clear-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .clear-btn:hover { background: var(--red-light); border-color: var(--red-light); color: var(--red); }

    .phase-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--green-light);
      color: var(--green);
      padding: 4px 11px;
      border-radius: 999px;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 16px;
      padding: 16px;
      background: var(--bg);
    }

    /* ── Transcript ── */
    .chat-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .bubble-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 82%;
    }
    .bubble-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row.advisor { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
    }
    .avatar.user { background: var(--accent-light); border: 1px solid var(--accent-light); color: var(--accent); }
    .avatar.advisor { background: var(--green-light); color: var(--green); }

    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.55;
      max-width: 100%;
      word-break: break-word;
    }
    .bubble-row.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-row.advisor .bubble {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-bottom-left-radius: 4px;
    }

    /* ── Controls ── */
    .controls {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      background: var(--card-bg);
    }

    #text-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      padding: 11px 15px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-input::placeholder { color: var(--muted2); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      padding: 11px 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #send-btn:hover { background: var(--accent-dark); }

    #mic-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    #mic-btn.recording {
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 0 0 6px var(--red-light);
      animation: pulse-mic 1s infinite;
    }
    #mic-btn.processing {
      background: var(--amber);
      border-color: var(--amber);
      cursor: not-allowed;
    }
    #mic-btn.speaking {
      background: var(--green-light);
      border-color: var(--green);
    }

    @keyframes pulse-mic {
      0%, 100% { box-shadow: 0 0 0 6px var(--red-light); }
      50%       { box-shadow: 0 0 0 12px var(--red-light); }
    }

    #status-label {
      font-size: 0.73rem;
      color: var(--muted);
      font-weight: 600;
      min-width: 70px;
      text-align: center;
    }

    /* ── Profile panel ── */
    .profile-col {
      width: 290px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .profile-col h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted2);
      font-weight: 700;
    }

    .profile-section { display: flex; flex-direction: column; gap: 6px; }
    .profile-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .profile-key { color: var(--muted); flex-shrink: 0; font-weight: 600; }
    .profile-val { color: var(--text); text-align: right; font-weight: 700; }

    .empty-profile {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      padding: 20px 0;
    }

    .typing-dots {
      display: inline-block;
      color: var(--muted);
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (max-width: 640px) {
      .profile-col { display: none; }
      .header-back span { display: none; }
      .layout { padding: 10px; gap: 10px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="header-back">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    <span>Home</span>
  </a>
  <a href="index.html" class="header-logo">
    <div class="header-logo-mark">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span class="header-brand">FinPal</span>
  </a>
  <span class="phase-badge" id="phase-badge">starting</span>
  <div class="header-right">
    <button class="theme-btn" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">&#127769;</button>
    <a href="#" class="dashboard-btn" id="dashboard-btn" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>View Plan</span>
    </a>
    <button class="clear-btn" id="clear-chat-btn" title="Clear chat history and memory">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
      <span>Clear Chat</span>
    </button>
  </div>
</header>

<div class="layout">

  <!-- Transcript -->
  <div class="chat-col">
    <div class="transcript" id="transcript">
      <div class="bubble-row advisor">
        <div class="avatar advisor">FP</div>
        <div class="bubble">Hi! I'm your FinPal advisor. Hold the mic button and tell me a bit about yourself — we'll start with where you study and how you're managing money right now.</div>
      </div>
    </div>

    <div class="controls">
      <button id="mic-btn" title="Hold to speak">🎤</button>
      <span id="status-label">ready</span>
      <input id="text-input" type="text" placeholder="Or type a message…" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Profile panel -->
  <div class="profile-col">
    <h2>Your Profile</h2>
    <div id="profile-content">
      <p class="empty-profile">Profile fills in as you talk.</p>
    </div>
  </div>

</div>

<script>
(function initTheme() {
  const saved = localStorage.getItem('finpal-theme');
  const btn = document.getElementById('theme-toggle');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  btn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('finpal-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('finpal-theme', 'dark');
    }
  });
})();

const API = 'http://localhost:8000';

let sessionId = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isBusy = false;
let currentAudio = null;

const SESSION_STORAGE_KEY = 'finpal-session-id';

async function tryResume(sid) {
  // Verify the session actually exists server-side before trusting it.
  const check = await fetch(`${API}/api/sessions/${sid}/profile`).catch(() => null);
  if (!check || !check.ok) return false;
  sessionId = sid;
  const profile = await check.json().catch(() => null);
  if (profile) updateProfile(profile);
  await replayHistory(sid);
  return true;
}

async function initSession() {
  // A session id in the URL (e.g. arriving from the dashboard) takes
  // priority; otherwise fall back to the last session stored in this
  // browser so a plain reload/revisit doesn't silently start a new,
  // disconnected session and orphan the one the dashboard is showing.
  const fromUrl = new URLSearchParams(location.search).get('session');
  const fromStorage = localStorage.getItem(SESSION_STORAGE_KEY);

  for (const candidate of [fromUrl, fromStorage]) {
    if (!candidate) continue;
    if (await tryResume(candidate)) {
      localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
      wireDashboardBtn();
      return;
    }
  }

  const r = await fetch(`${API}/api/sessions`, { method: 'POST' });
  const d = await r.json();
  sessionId = d.session_id;
  localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
  wireDashboardBtn();
}

async function clearChat() {
  if (!sessionId) return;
  if (!confirm('Clear chat history and everything FinPal remembers about you? This starts a fresh conversation.')) return;
  const r = await fetch(`${API}/api/sessions/${sessionId}/reset`, { method: 'POST' }).catch(() => null);
  if (!r || !r.ok) { alert('Could not clear chat. Is the backend running?'); return; }
  const d = await r.json();
  document.getElementById('transcript').innerHTML = '';
  addBubble('advisor', "Hi! I'm your FinPal advisor. Hold the mic button and tell me a bit about yourself — we'll start with where you study and how you're managing money right now.");
  updateProfile(d.profile);
  document.getElementById('phase-badge').textContent = 'starting';
  setStatus('ready');
}

document.getElementById('clear-chat-btn').addEventListener('click', clearChat);

async function replayHistory(sid) {
  const res = await fetch(`${API}/api/sessions/${sid}/messages`).catch(() => null);
  if (!res || !res.ok) return;
  const { messages } = await res.json().catch(() => ({ messages: [] }));
  if (!Array.isArray(messages) || messages.length === 0) return;
  document.getElementById('transcript').innerHTML = '';
  for (const m of messages) {
    if (m.role === 'user') addBubble('user', m.content);
    else if (m.role === 'assistant' && m.content) addBubble('advisor', stripMemoryTag(m.content));
  }
}

function wireDashboardBtn() {
  const btn = document.getElementById('dashboard-btn');
  if (!btn || !sessionId) return;
  btn.href = `dashboard.html?session=${sessionId}`;
  btn.style.display = 'flex';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addBubble(role, text) {
  const row = document.createElement('div');
  row.className = `bubble-row ${role}`;
  row.innerHTML = `
    <div class="avatar ${role}">${role === 'user' ? 'U' : 'FP'}</div>
    <div class="bubble">${escHtml(text)}</div>
  `;
  document.getElementById('transcript').appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function createStreamingBubble() {
  const row = document.createElement('div');
  row.className = 'bubble-row advisor';
  row.innerHTML = `<div class="avatar advisor">FP</div><div class="bubble"><span class="typing-dots">···</span></div>`;
  document.getElementById('transcript').appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return row.querySelector('.bubble');
}

const _MEMORY_TAG_RE = /^\[Memory:[^\]]*\]\s*/i;
function stripMemoryTag(text) { return text.replace(_MEMORY_TAG_RE, ''); }

function appendToken(bubble, token) {
  const dots = bubble.querySelector('.typing-dots');
  if (dots) dots.remove();
  bubble.textContent += token;
  bubble.closest('.bubble-row').scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function setStatus(state) {
  const btn = document.getElementById('mic-btn');
  const lbl = document.getElementById('status-label');
  btn.className = '';
  if (state === 'recording')  { btn.classList.add('recording');  lbl.textContent = 'recording…'; }
  else if (state === 'processing') { btn.classList.add('processing'); lbl.textContent = 'thinking…'; }
  else if (state === 'speaking')   { btn.classList.add('speaking');   lbl.textContent = 'speaking…'; }
  else { lbl.textContent = 'ready'; }
}

function playAudio(b64) {
  return new Promise(resolve => {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    setStatus('speaking');
    currentAudio.onended = () => { URL.revokeObjectURL(url); setStatus('ready'); resolve(); };
    currentAudio.onerror  = () => { URL.revokeObjectURL(url); setStatus('ready'); resolve(); };
    currentAudio.play().catch(() => { setStatus('ready'); resolve(); });
  });
}

async function sendToAPI(formData, isVoice) {
  if (isBusy) return;
  isBusy = true;
  setStatus('processing');

  try {
    if (!isVoice) {
      addBubble('user', formData);
      const advisorBubble = createStreamingBubble();

      const r = await fetch(`${API}/api/sessions/${sessionId}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: formData }),
      });

      if (!r.ok) { advisorBubble.textContent = `⚠ Error ${r.status}`; return; }

      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let firstToken = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          try {
            const ev = JSON.parse(part.slice(6));
            if (ev.type === 'token') {
              // Strip any [Memory: ...] tag that leaks into the first token(s)
              let tok = ev.text;
              if (firstToken) { tok = stripMemoryTag(tok); firstToken = false; }
              if (tok) appendToken(advisorBubble, tok);
            } else if (ev.type === 'done') { updateProfile(ev.profile); setStatus('ready'); }
          } catch {}
        }
      }
      return;
    }

    const r = await fetch(`${API}/api/sessions/${sessionId}/voice`, { method: 'POST', body: formData });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      addBubble('advisor', `⚠ Error: ${err.detail || r.statusText}`);
      return;
    }
    const d = await r.json();
    addBubble('user', d.user_text);
    addBubble('advisor', stripMemoryTag(d.advisor_text));
    updateProfile(d.profile);
    if (d.audio_b64) await playAudio(d.audio_b64);
    else setStatus('ready');

  } catch (e) {
    addBubble('advisor', '⚠ Could not reach the server. Is the backend running?');
    setStatus('ready');
  } finally {
    isBusy = false;
  }
}

const micBtn = document.getElementById('mic-btn');

async function startRec() {
  if (isBusy || isRecording) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
        ? 'audio/ogg;codecs=opus'
        : 'audio/mp4';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      if (blob.size < 1000) { setStatus('ready'); return; }
      const fd = new FormData();
      fd.append('audio', blob, 'recording' + mimeTypeToExt(mediaRecorder.mimeType));
      await sendToAPI(fd, true);
    };
    mediaRecorder.start();
    isRecording = true;
    setStatus('recording');
  } catch (e) {
    alert('Microphone access denied. Use the text input instead.');
  }
}

function stopRec() {
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  mediaRecorder.stop();
}

function mimeTypeToExt(mime) {
  if (mime.includes('webm')) return '.webm';
  if (mime.includes('ogg'))  return '.ogg';
  if (mime.includes('mp4'))  return '.mp4';
  return '.webm';
}

micBtn.addEventListener('mousedown',  e => { e.preventDefault(); startRec(); });
micBtn.addEventListener('mouseup',    stopRec);
micBtn.addEventListener('mouseleave', stopRec);
micBtn.addEventListener('touchstart', e => { e.preventDefault(); startRec(); }, { passive: false });
micBtn.addEventListener('touchend',   e => { e.preventDefault(); stopRec(); },  { passive: false });

const textInput = document.getElementById('text-input');
document.getElementById('send-btn').addEventListener('click', sendText);
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

async function sendText() {
  const msg = textInput.value.trim();
  if (!msg || isBusy) return;
  textInput.value = '';
  await sendToAPI(msg, false);
}

function fmt(val) {
  if (val === null || val === undefined) return null;
  if (typeof val === 'number') return '₹' + val.toLocaleString('en-IN');
  if (typeof val === 'boolean') return val ? 'Yes' : 'No';
  if (typeof val === 'object') {
    // Fields that should be a plain scalar occasionally come back as an
    // object instead — shapes vary ({amount, note}, {stability, notes}, a
    // bare {note}, etc.) — so recover generically rather than chasing each
    // key name: prefer a numeric amount, then the first short string field,
    // rather than ever rendering "[object Object]" or silently dropping it.
    if (typeof val.amount === 'number') return '₹' + val.amount.toLocaleString('en-IN');
    const firstString = Object.values(val).find(v => typeof v === 'string' && v.trim());
    if (firstString) return firstString;
    return null;
  }
  return String(val).replace(/_/g, ' ');
}

function profileRow(key, val) {
  const v = fmt(val);
  if (!v) return '';
  return `<div class="profile-row">
    <span class="profile-key">${key}</span>
    <span class="profile-val">${escHtml(v)}</span>
  </div>`;
}

function profileSection(title, rows) {
  const content = rows.join('');
  if (!content) return '';
  return `<div class="profile-section">
    <div class="profile-section-title">${title}</div>
    ${content}
  </div>`;
}

function updateProfile(p) {
  if (!p) return;
  document.getElementById('phase-badge').textContent =
    (p.conversation_phase || 'rapport').replace(/_/g, ' ');

  const ac = p.academic || {};
  const mi = p.money_in || {};
  const ex = p.expenses || {};
  const sn = p.safety_net || {};
  const cr = p.credit || {};

  const academic = profileSection('Academic', [
    profileRow('Field of study', ac.field_of_study),
    profileRow('Year of study', ac.year_of_study != null ? String(ac.year_of_study) : null),
    profileRow('Graduation year', ac.expected_graduation_year != null ? String(ac.expected_graduation_year) : null),
  ]);
  const totalIncome = [mi.family_support_amount, mi.gig_income_amount, mi.scholarship_stipend_amount]
    .reduce((sum, v) => sum + (typeof v === 'number' ? v : (v && typeof v.amount === 'number' ? v.amount : 0)), 0);
  const moneyIn = profileSection('Income Sources', [
    profileRow('Family support', mi.family_support_amount),
    profileRow('Regularity', mi.family_support_regularity),
    profileRow('Gig income', mi.gig_income_amount),
    profileRow('Scholarship/Stipend', mi.scholarship_stipend_amount),
    profileRow('Stability', mi.income_stability),
    totalIncome > 0 ? profileRow('Total income', totalIncome) : '',
  ]);
  const expenses = profileSection('Expenses', [
    profileRow('Housing', ex.housing?.amount),
    profileRow('Housing type', ex.housing?.type),
    profileRow('Commute', ex.commute?.amount),
    profileRow('Food (extra)', ex.food_beyond_mess),
    profileRow('Subscriptions', ex.subscriptions),
    profileRow('Discretionary', ex.discretionary),
    profileRow('BNPL spend', ex.bnpl_usage?.typical_monthly_amount),
  ]);
  const safetyNet = profileSection('Safety Net', [
    profileRow('Savings', sn.personal_savings_amount),
    profileRow('Health insurance', sn.health_insurance_cover ? 'Yes' : null),
    profileRow('Provided by', sn.provided_by),
    profileRow('If urgent', sn.would_rely_on_if_urgent),
  ]);
  const debtRows = (p.debt || []).map((d, i) => profileRow(`Debt ${i+1} (${d.type || '?'})`, d.balance ?? d.outstanding ?? d.amount));
  const debt = profileSection('Debt', debtRows);
  const creditSec = profileSection('Credit', [
    profileRow('Cards', cr.cards != null ? String(cr.cards) : null),
    profileRow('Limit', cr.total_limit),
    profileRow('Utilisation', cr.typical_utilization_pct != null ? cr.typical_utilization_pct + '%' : null),
  ]);
  const goalsArr = Array.isArray(p.goals) ? p.goals : (p.goals && typeof p.goals === 'object' ? [p.goals] : []);
  const goals = goalsArr.map((g, i) => profileRow(`Goal ${i+1}`, g.type));
  const goalsSec = profileSection('Goals', goals);

  const combined = [academic, moneyIn, expenses, safetyNet, debt, creditSec, goalsSec].join('');
  document.getElementById('profile-content').innerHTML =
    combined || '<p class="empty-profile">Profile fills in as you talk.</p>';
}

initSession().catch(() => {
  document.getElementById('status-label').textContent = 'offline';
});
</script>
